name: Native package validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.0"
      - run: cargo build --locked --workspace
      - run: cargo test --locked --lib
      - run: cargo run --locked -p systest
      - name: Verify actual native crate contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo package --locked -p sshw-libssh2-sys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $archive = Join-Path $metadata.target_directory 'package/sshw-libssh2-sys-0.1.0.crate'
          python scripts/verify-native-package.py $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_package_verification.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.89.0"
      - run: cargo check --locked -p sshw-ssh2 -p sshw-libssh2-sys
