[package]
name = "sshw-libssh2-sys"
version = "0.1.0"
edition = "2015"
rust-version = "1.89"
authors = ["Alex Crichton <alex@alexcrichton.com>", "Wez Furlong <wez@wezfurlong.org>", "Matteo Bigoi <bigo@crisidev.org>"]
links = "ssh2"
build = "build.rs"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository = "https://github.com/Lv2dev/sshw-native"
documentation = "https://docs.rs/sshw-libssh2-sys"
description = "SSHW-maintained native SSH bindings with a pinned, verified libssh2 source bundle"
readme = "README.md"
include = ["/lib.rs", "/build.rs", "/README.md", "/LICENSE-*", "/NATIVE-SOURCE.json", "/libssh2/src/**", "/libssh2/include/**", "/libssh2/COPYING", "/libssh2/libssh2.pc.in"]

[lib]
name = "libssh2_sys"
path = "lib.rs"

[features]
vendored-openssl = ["openssl-sys/vendored"]
zlib-ng-compat = ["libz-sys/zlib-ng"]
openssl-on-win32 = ["openssl-sys"]

[dependencies]
libc = "0.2"
libz-sys = { version = "1.1.0", default-features = false, features = ["libc"] }

[target."cfg(unix)".dependencies]
openssl-sys = "0.9.35"

[target."cfg(windows)".dependencies]
openssl-sys = { version="0.9.35", optional = true }

[build-dependencies]
cc = "1.0.25"
